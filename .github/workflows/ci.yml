name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hapi
          POSTGRES_USER: hapi
          POSTGRES_PASSWORD: hapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hapi:hapi@localhost:5432/hapi
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the checkout to the actual commit under test. Without this,
          # actions/checkout's default ref on a `pull_request` event is the
          # synthetic `refs/pull/<N>/merge` commit -- a merge of this branch's
          # tip into the base branch's tip -- whose *tree* is the union of
          # both branches' files. The site-graph-v0 public-boundary scan
          # (pipeline/tests/test_site_graph_v0_contract.py) walks the entire
          # current checkout, so under that topology it also sees base-branch
          # files this PR never touched and can fail on files that were
          # already reviewed and merged separately. Checking out the PR's own
          # head SHA makes CI scan exactly what a local checkout of this
          # branch scans. `github.sha` is the fallback for non-PR (push)
          # triggers, where `github.event.pull_request` does not exist.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Create Postgres schemas
        run: psql "$DATABASE_URL" -f ../docker/init-schemas.sql
        working-directory: pipeline

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    needs: pipeline
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hapi
          POSTGRES_USER: hapi
          POSTGRES_PASSWORD: hapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hapi:hapi@localhost:5432/hapi
    steps:
      - uses: actions/checkout@v4

      - name: Create Postgres schemas
        run: psql "$DATABASE_URL" -f ../docker/init-schemas.sql
        working-directory: web

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline migrations
        working-directory: pipeline
        run: uv sync && uv run alembic upgrade head

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
